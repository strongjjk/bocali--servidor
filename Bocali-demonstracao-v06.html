function storeView(){const s=findShop(shopId);if(!s)return empty('Loja n\u00e3o encontrada','Escolha uma das lojas cadastradas.','#/minhas-lojas','Voltar');
 const products=state.products.filter(p=>p.storeId===s.id&&p.available);const categories=['Todos',...new Set(products.map(p=>p.category))];

function cartHTML(){const t=C.totals(state.cart);const s=findShop(state.cart.storeId);return `<h3>${ico('bag')} Sua sacola ${t.quantity?`<span class="muted small">(${t.quantity})</span>`:''}</h3>${!state.cart.items.length?`<div class="empty"><div class="empty-icon">${ico('bag')}</div><strong>Uma del\u00edcia por vez.</strong>Escolha um produto para come\u00e7ar seu pedido.</div>`:`<p class="small muted">${esc(s?.name||'')}</p>${state.cart.items.map((i,index)=>`<div class="cart-line"><div class="line-content"><strong>${esc(i.name)}</strong>${i.extras.length?`<small>${i.extras.map(e=>esc(e.name)).join(', ')}</small><br>`:''}${i.note?`<small>${esc(i.note)}</small>`:''}<div class="qty-small"><button data-action="cart-minus" data-index="${index}" aria-label="Diminuir ${esc(i.name)}">${ico('minus')}</button><span>${i.quantity}</span><button data-action="cart-plus" data-index="${index}" aria-label="Aumentar ${esc(i.name)}">${ico('plus')}</button></div></div><span class="price">${brl((i.unitPrice+i.extras.reduce((s,e)=>s+e.price,0))*i.quantity)}</span></div>`).join('')}<div class="amount-row total"><span>Subtotal</span><span>${brl(t.subtotal)}</span></div><p class="small muted" style="margin-bottom:17px">Entrega calculada na pr\u00f3xima etapa.</p><button class="btn full" data-action="checkout">Continuar ${ico('arrow')}</button><p class="cart-caption">Somente simula\u00e7\u00e3o. Sem cobran\u00e7a.</p>`}`;}
const statusLabel={new:'Aguardando aceite',accepted:'Aceito',preparing:'Em preparo',ready:'Pronto',dispatched:'Saiu para entrega',completed:'Conclu\u00eddo',cancelled:'Cancelado'};
function orderNext(o){return ({accepted:['preparing','Iniciar preparo'],preparing:['ready',o.fulfillment==='pickup'?'Pronto para retirar':'Pronto para sair'],ready:o.fulfillment==='delivery'?['dispatched','Saiu para entrega']:['completed','Confirmar retirada'],dispatched:['completed','Confirmar entrega']})[o.status];}
function orderEta(o){
 if(o.status==='new')return '<div class="eta-info awaiting">'+ico('clock')+'<div><strong>Prazo ainda n\u00e3o confirmado</strong><span>O restaurante define a previs\u00e3o ao aceitar.</span></div></div>';
 if(!o.eta||o.status==='cancelled')return '';
 const label=o.fulfillment==='delivery'?'Entrega prevista':'Retirada prevista',active=!['completed','cancelled'].includes(o.status),late=active&&Date.now()>Date.parse(o.eta.to);
 return `<div class="eta-info ${late?'late':''}">${ico('clock')}<div><strong>${label}: ${clock(o.eta.from)} a ${clock(o.eta.to)}</strong><span>${o.eta.minMinutes}\u2013${o.eta.maxMinutes} min a partir do aceite \u00b7 ${dt(o.acceptedAt)}${late?' \u00b7 prazo estimado ultrapassado':''}</span></div></div>`;
}
function printHint(o){
 if(o.status==='new'||o.status==='cancelled')return '';
 const s=O.printState(o),text={not_requested:'Comanda da cozinha ainda n\u00e3o solicitada',pending:'Confira se a comanda saiu na impressora',failed:'Impress\u00e3o n\u00e3o saiu: tente novamente',confirmed:'Comanda confirmada pelo operador'}[s];
 return `<div class="print-hint ${s==='confirmed'?'ok':'warn'}">${ico('printer')}<span>${text}</span></div>`;
}
function orderCard(o,admin=false){
 const steps=['new','accepted','preparing','ready',...(o.fulfillment==='delivery'?['dispatched']:[]),'completed'],step=steps.indexOf(o.status),next=orderNext(o);
 return `<article class="order-card ${admin&&o.status==='new'?'incoming':''}" data-order-id="${esc(o.id)}"><div class="order-top"><div><h3>${esc(admin?o.id:o.storeName)}</h3><p>${admin?'Cliente de teste':esc(o.id)} \u00b7 ${dt(o.createdAt)}</p></div><div class="order-badges"><span class="fulfillment-badge ${o.fulfillment}">${o.fulfillment==='delivery'?'ENTREGA':'RETIRADA / BALC\u00c3O'}</span><span class="status ${o.status}">${statusLabel[o.status]}</span></div></div>${orderEta(o)}${typeof deliveryOrderHTML==='function'?deliveryOrderHTML(o):''}<div class="order-body">${o.items.map(i=>`<div><span><b>${i.quantity}\u00d7</b> ${esc(i.name)}${i.extras.length?' <small class="muted">+ '+i.extras.map(e=>esc(e.name)).join(', ')+'</small>':''}${i.note?'<br><small class="item-note">OBS.: '+esc(i.note)+'</small>':''}</span><span>${brl((i.unitPrice+i.extras.reduce((s,e)=>s+e.price,0))*i.quantity)}</span></div>`).join('')}${o.fee?`<div class="muted"><span>Entrega</span><span>${brl(o.fee)}</span></div>`:''}</div>${o.note?`<div class="order-note"><strong>Observa\u00e7\u00e3o do pedido</strong><p>${esc(o.note)}</p></div>`:''}${admin?printHint(o):''}<div class="order-bottom"><div><strong>${brl(o.total)}</strong><div class="muted" style="font-size:10px">${({cash:'Dinheiro',card:'Cart\u00e3o',pix:'Pix'})[o.payment]} \u00b7 n\u00e3o cobrado</div></div><div class="order-actions">${admin?`${o.status==='new'?`<button class="btn" data-action="accept-order" data-id="${esc(o.id)}">${ico('check')} Aceitar e definir prazo</button>`:''}${next?`<button class="btn" data-action="status" data-id="${esc(o.id)}" data-to="${next[0]}">${next[1]}</button>`:''}${!['completed','cancelled'].includes(o.status)?`<button class="btn danger" data-action="status" data-id="${esc(o.id)}" data-to="cancelled">${o.status==='new'?'Recusar':'Cancelar'}</button>`:''}`:`<button class="btn secondary" data-action="reorder" data-id="${esc(o.id)}">${ico('bag')} Pedir novamente</button>`}</div></div>${admin&&O.canPrint(o,'kitchen')?`<div class="print-actions"><button class="btn secondary" data-action="receipt" data-id="${esc(o.id)}" data-kind="kitchen">${ico('printer')} Comanda da cozinha</button><button class="text-link" data-action="receipt" data-id="${esc(o.id)}" data-kind="counter">Via do balc\u00e3o</button></div>`:''}${admin&&O.canPrint(o,'cancellation')?`<div class="notice red spaced">Cancelamento n\u00e3o recolhe a comanda j\u00e1 impressa. Avise a cozinha.<button class="btn danger spaced" data-action="receipt" data-id="${esc(o.id)}" data-kind="cancellation">Imprimir aviso de cancelamento</button></div>`:''}${!admin&&o.status!=='cancelled'?`<div class="timeline">${steps.map((st,n)=>`<div class="timeline-step ${n<=step?'done':''}">${statusLabel[st]}</div>`).join('')}</div>`:''}</article>`;
}

function dashboardView(){
 const s=adminShop(),all=state.orders.filter(o=>o.storeId===s.id),active=all.filter(o=>!['completed','cancelled'].includes(o.status)),fresh=all.filter(o=>o.status==='new'),pending=active.filter(o=>o.status!=='new'&&O.printState(o)!=='confirmed'),prefs=printerPrefs();

e3o ao aceitar</label><button class="btn secondary compact" data-action="toggle-sound">${ico('bell')} ${soundEnabled?'Desativar som':'Ativar som'}</button></div><p class="small muted">O navegador n\u00e3o confirma se o papel saiu. Confira cada comanda; som apenas com esta aba ativa. Impress\u00e3o direta ainda n\u00e3o conectada.</p></section><div class="queue-heading"><div><h2>Fila de pedidos</h2><p class="small muted">${fresh.length?'H\u00e1 pedidos aguardando sua confirma\u00e7\u00e3o.':'Seu atendimento, em um s\u00f3 lugar.'}</p></div><div class="test-order-actions"><button class="btn secondary compact" data-action="demo-order" data-mode="delivery">${ico('plus')} Testar entrega</button><button class="btn secondary compact" data-action="demo-order" data-mode="pickup">Testar retirada</button></div></div><div class="chips" style="margin-bottom:18px">${[['all','Todos'],['new','Novos'],['accepted','Aceitos'],['preparing','Em preparo'],['ready','Prontos'],['dispatched','Em entrega'],['printing','Conferir impress\u00e3o'],['completed','Conclu\u00eddos'],['cancelled','Cancelados']].map(([v,l])=>`<button class="chip ${orderFilter===v?'active':''}" data-action="order-filter" data-filter="${v}">${l}${v==='new'&&fresh.length?' ('+fresh.length+')':''}</button>`).join('')}</div>${shown.length?shown.map(o=>orderCard(o,true)).join(''):empty('Nenhum pedido nesta fila','Use os bot\u00f5es de teste acima ou simule uma compra no card\u00e1pio.','#/loja/'+s.id,'Abrir card\u00e1pio')}<div class="notice spaced">Prot\u00f3tipo local: nada \u00e9 enviado ao restaurante. Dados e pagamentos fict\u00edcios. N\u00e3o substitua seu aceitador atual por esta demonstra\u00e7\u00e3o.</div>`;
}

function editorView(){const s=adminShop(),products=state.products.filter(p=>p.storeId===s.id);return `${adminHeading('Seu card\u00e1pio, do seu jeito.','Edite produtos, pre\u00e7os e disponibilidade sem alterar pedidos antigos.')}<div class="toolbar"><a href="#/importar" class="btn">${ico('upload')} Importar PDF</a><button class="btn secondary" data-action="new-product">${ico('plus')} Adicionar produto</button><a class="text-link" href="#/loja/${s.id}" style="margin-left:auto">Ver loja ${ico('arrow')}</a></div><div class="notice" style="margin-bottom:20px">Os dados iniciais s\u00e3o ilustrativos. Alterar o card\u00e1pio aqui afeta somente esta demonstra\u00e7\u00e3o, n\u00e3o o GloriaFood.</div><div class="panel"><div class="section-heading" style="margin:0 0 8px"><h2>Produtos <span>${products.length}</span></h2><span class="small muted">${products.filter(p=>p.available).length} dispon\u00edveis</span></div>${products.map(p=>`<div class="editor-row"><div class="product-art ${p.art}">${ico(p.art)}</div><div class="grow"><h3>${esc(p.name)}</h3><p class="small muted">${esc(p.category)}${!p.available?' \u00b7 Indispon\u00edvel':''}</p></div><strong class="price">${brl(p.price)}</strong><button class="switch ${p.available?'on':''}" role="switch" aria-checked="${p.available}" aria-label="Disponibilidade de ${esc(p.name)}" data-action="toggle-product" data-id="${p.id}"></button><button class="icon-btn" data-action="edit-product" data-id="${p.id}" aria-label="Editar ${esc(p.name)}">${ico('edit')}</button></div>`).join('')||'<p class="muted">Nenhum produto cadastrado.</p>'}</div>`;}
function importView(){return `${adminHeading('Do PDF para o pedido.','Comece com seu card\u00e1pio. Revise cada produto antes de publicar.')}<div class="steps"><div class="step active"><span class="step-number">1</span>Enviar card\u00e1pio</div><span class="step-line"></span><div class="step ${draft.length?'active':''}"><span class="step-number">2</span>Conferir produtos</div><span class="step-line"></span><div class="step"><span class="step-number">3</span>Publicar no teste</div></div><div class="upload-grid"><section class="panel"><div class="dropzone"><div class="upload-icon">${ico('upload')}</div><h3>Aquele card\u00e1pio do WhatsApp.</h3><p>Selecione um PDF com texto selecion\u00e1vel. At\u00e9 10 MB e 25 p\u00e1ginas. N\u00e3o precisa enviar fotos dos documentos pessoais.</p><label><span class="only-screen-reader">Escolher card\u00e1pio PDF</span><input type="file" accept="application/pdf,.pdf" id="pdf-file" class="file-input" ${importBusy||pdfReady===false?'disabled':''}></label><p id="pdf-status" aria-live="polite">${importBusy?'Lendo PDF...':pdfReady===true?'Leitura de PDF conectada ao servidor local.':pdfReady===false?'Leitura de PDF: execute o projeto completo. Neste HTML, use o texto colado abaixo.':'Verificando leitor de PDF...'}</p></div><details class="details" ${!draft.length?'open':''}><summary>Colar o texto ou experimentar com um exemplo</summary><p class="small muted">Uma linha por produto. Exemplo: Pastel de queijo R$ 14,90. Sem precisar enviar arquivo.</p><textarea class="raw-text" id="raw-text" aria-label="Texto do card\u00e1pio" placeholder="CL\u00c1SSICOS&#10;Pastel de queijo R$ 14,90&#10;Pastel de carne R$ 15,90">${esc(rawText)}</textarea><div class="row" style="flex-wrap:wrap"><button class="btn secondary" data-action="parse-text">${ico('file')} Organizar produtos</button><button class="text-link" data-action="sample-menu">Usar exemplo</button></div></details></section><aside class="panel"><h2>Voc\u00ea continua no controle.</h2><div class="check-list"><div class="check-row">${ico('check')}<div><strong>Um rascunho, n\u00e3o uma publica\u00e7\u00e3o.</strong><p>A leitura organiza nomes e pre\u00e7os reconhecidos. Voc\u00ea confere tudo.</p></div></div><div class="check-row">${ico('check')}<div><strong>Sem inventar ingredientes ou fotos.</strong><p>Descri\u00e7\u00f5es e adicionais ficam para cadastro manual.</p></div></div><div class="check-row">${ico('check')}<div><strong>Mais de um pre\u00e7o? Precisa revisar.</strong><p>Tamanhos e colunas misturadas n\u00e3o s\u00e3o publicados automaticamente.</p></div></div><div class="check-row">${ico('shield')}<div><strong>Arquivo tempor\u00e1rio, teste local.</strong><p>O servidor inclu\u00eddo l\u00ea o PDF em mem\u00f3ria e n\u00e3o o salva. Sem IA externa.</p></div></div></div></aside></div>${draft.length?`<div class="section-heading"><h2>Confira seu rascunho <span>${draft.length}</span></h2><button class="text-link" data-action="add-draft">${ico('plus')} Nova linha</button></div><div class="notice"><strong>Confira o PDF completo, n\u00e3o apenas as linhas abaixo.</strong> Linhas podem ser omitidas, agrupadas ou lidas incorretamente. ${esc(importSource)}<div class="warning-list">${draftWarnings.map(w=>`<p>${esc(w)}</p>`).join('')}</div></div><div id="draft-list">${draft.map(d=>draftRow(d)).join('')}</div><div class="publish-bar"><div><strong id="review-count">${draft.filter(C.validDraft).length} de ${draft.length} conferidos</strong><small>Adiciona novos produtos. N\u00e3o substitui o card\u00e1pio existente.</small></div><button class="btn" id="publish-button" data-action="publish" ${draft.every(C.validDraft)?'':'disabled'}>${ico('check')} Publicar no teste</button></div>`:''}`;}
function draftRow(d){return `<article class="draft" data-draft="${d.id}"><div class="draft-footer"><strong class="small">Produto para confer\u00eancia</strong><button class="icon-btn" data-action="remove-draft" data-id="${d.id}" aria-label="Remover linha do rascunho">${ico('trash')}</button></div><div class="draft-grid"><label>Nome do produto<input data-draft-id="${d.id}" data-field="name" value="${esc(d.name)}" maxlength="100" required></label><label>Categoria<input data-draft-id="${d.id}" data-field="category" value="${esc(d.category)}" maxlength="50" required></label><label>Pre\u00e7o (R$)<input data-draft-id="${d.id}" data-field="price" value="${d.price===null?'':(d.price/100).toFixed(2).replace('.',',')}" placeholder="Confirme o valor" inputmode="decimal" required></label></div><label style="display:block;margin-top:14px">Descri\u00e7\u00e3o (opcional)<input data-draft-id="${d.id}" data-field="description" value="${esc(d.description)}" maxlength="240" placeholder="Preencha sem inventar informa\u00e7\u00f5es do produto"></label><div class="source">Texto original: ${esc(d.source||'Cadastro manual')}${d.ambiguous?' \u00b7 MAIS DE UM PRE\u00c7O DETECTADO':''}</div><label class="check-label"><input type="checkbox" data-review="${d.id}" ${d.reviewed?'checked':''}>Conferi nome, descri\u00e7\u00e3o, categoria e pre\u00e7o no card\u00e1pio.</label></article>`;}
function settingsView(){return `${adminHeading('Um teste com transpar\u00eancia.','Veja o que est\u00e1 funcionando e o que ainda precisa ser conectado.')}<div class="panel"><h2>Sobre esta vers\u00e3o</h2><div class="info-box"><strong>Funciona neste navegador</strong><p>Card\u00e1pios, favoritos, sacola, pedidos simulados, aceite com prazo, comandas via navegador, fila da loja, edi\u00e7\u00e3o de produtos e revis\u00e3o de importa\u00e7\u00e3o. Os testes s\u00e3o salvos no armazenamento local, quando permitido.</p></div><div class="info-box"><strong>Ainda n\u00e3o \u00e9 uma opera\u00e7\u00e3o comercial</strong><p>Sem login real, banco de dados compartilhado, pagamentos, disparos de WhatsApp, impress\u00e3o direta, entregadores ou transmiss\u00e3o de pedidos ao restaurante. O seletor de lojas \u00e9 uma demonstra\u00e7\u00e3o, n\u00e3o controle de acesso.</p></div><div class="info-box"><strong>O que acontece com o PDF?</strong><p>No projeto completo, o arquivo vai para o servidor que voc\u00ea executar, \u00e9 lido em mem\u00f3ria e n\u00e3o \u00e9 mantido em disco. O parser organiza texto por regras, sem IA externa e sem OCR. O rascunho deve ser conferido integralmente.</p></div><div class="info-box"><strong>N\u00e3o use dados de clientes reais</strong><p>Todos que acessam este perfil do navegador podem ver os dados locais. Eles n\u00e3o s\u00e3o sincronizados entre aparelhos. A limpeza do navegador pode apag\u00e1-los.</p></div><div class="toolbar"><button class="btn secondary" data-action="export">${ico('download')} Exportar dados do teste</button><button class="btn danger" data-action="reset">Reiniciar demonstra\u00e7\u00e3o</button></div><div class="notice">${storageOk?'Armazenamento local habilitado.':'Armazenamento local indispon\u00edvel. As mudan\u00e7as durar\u00e3o apenas nesta aba.'} Bocali \u00e9 o nome escolhido para o projeto. Disponibilidade de marca e dom\u00ednio ainda n\u00e3o foi verificada.</div></div>`;}
function render(){if(window.PedeDelivery)window.PedeDelivery.migrate(state);let content;switch(view){case'minhas-lojas':content=favoritesView();break;case'explorar':content=exploreView();break;case'loja':content=storeView();break;case'pedidos':content=ordersView();break;case'painel':content=dashboardView();break;case'cardapio':content=editorView();break;case'importar':content=importView();break;case'areas':content=typeof deliveryView==='function'?deliveryView():'';break;case'configuracoes':content=settingsView();break;default:content=favoritesView();}shell(content);if(view==='areas'&&typeof mountDeliveryMap==='function')mountDeliveryMap();if(view==='importar'&&pdfReady===null)checkPdfServer();}
function route(){const bits=location.hash.replace(/^#\/?/,'').split('/');view=bits[0]||'minhas-lojas';shopId=bits[1]||'cantinho';filter='Todos';search='';closeModal();render();window.scrollTo({top:0});}
function openModal(title,body){modalPrevFocus=document.activeElement;const m=$('#modal');m.className='modal';m.innerHTML=`<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Fechar janela">${ico('close')}</button></div><div class="modal-content">${body}</div>`;if(!m.open)m.showModal();}
function closeModal(){document.body.classList.remove('receipt-print-active');$('#print-root')?.replaceChildren();const m=$('#modal');if(m.open)m.close();productModal=null;}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
$('#modal').addEventListener('close',()=>{if(modalPrevFocus?.isConnected)modalPrevFocus.focus();});
function showProduct(id){const p=state.products.find(p=>p.id===id);if(!p||!p.available)return;productModal=p;modalQty=1;modalExtras=[];openModal(esc(p.name),`<div class="modal-product">${ico(p.art)}</div><strong>${brl(p.price)}</strong><p class="modal-description">${esc(p.description)}</p>${p.extras.length?`<h3 class="small">Deixe do seu jeito <span class="muted">\u00b7 opcionais</span></h3>${p.extras.map(e=>`<div class="extra"><label><input type="checkbox" data-extra="${e.id}">${esc(e.name)}</label><span>+ ${brl(e.price)}</span></div>`).join('')}`:''}<label class="field" style="margin-top:20px"><span>Alguma observa\u00e7\u00e3o?</span><textarea id="product-note" maxlength="160" placeholder="Ex.: sem azeitona. Use apenas dados de teste."></textarea></label><div class="modal-footer"><div class="counter"><button data-action="product-minus" aria-label="Diminuir quantidade">${ico('minus')}</button><span id="product-quantity">1</span><button data-action="product-plus" aria-label="Aumentar quantidade">${ico('plus')}</button></div><button class="btn" data-action="add-cart">Adicionar <span id="product-price">${brl(p.price)}</span></button></div><p class="cart-caption">Produto de exemplo. N\u00e3o \u00e9 uma compra real.</p>`);productModal=p;}
function productTotal(){if(!productModal)return;$('#product-quantity').textContent=modalQty;$('#product-price').textContent=brl((productModal.price+productModal.extras.filter(e=>modalExtras.includes(e.id)).reduce((s,e)=>s+e.price,0))*modalQty);}
function addToCart(){const p=productModal;if(!p)return;const s=findShop(p.storeId);if(!s.open)return toast('A loja est\u00e1 pausada no teste.');if(state.cart.items.length&&state.cart.storeId!==p.storeId){if(!confirm('A sacola tem produtos de outra loja. Limpar a sacola e come\u00e7ar este pedido?'))return;state.cart={storeId:null,items:[]};}state.cart.storeId=p.storeId;const extras=p.extras.filter(e=>modalExtras.includes(e.id));const note=$('#product-note').value.trim();const existing=state.cart.items.find(i=>i.productId===p.id&&i.note===note&&JSON.stringify(i.extras)===JSON.stringify(extras)&&i.unitPrice===p.price);if(existing){if(existing.quantity+modalQty>20)return toast('Limite de 20 unidades por item no teste.');existing.quantity+=modalQty;}else state.cart.items.push({id:C.uid(),productId:p.id,name:p.name,unitPrice:p.price,quantity:modalQty,extras:JSON.parse(JSON.stringify(extras)),note});save();closeModal();render();toast('Adicionado \u00e0 sacola de '+s.name+'.');}
function cartModal(){openModal('Sua sacola',cartHTML().replace(/^<h3>[\s\S]*?<\/h3>/,''));}
function reorder(id){const o=state.orders.find(o=>o.id===id);if(!o)return;const s=findShop(o.storeId);if(!s?.open)return toast('Esta loja est\u00e1 pausada.');if(state.cart.items.length&&!confirm('Substituir a sacola pelo pedido anterior, usando pre\u00e7os e disponibilidade atuais?'))return;const items=[];let skipped=0;for(const i of o.items){const p=state.products.find(p=>p.id===i.productId&&p.storeId===o.storeId&&p.available);if(!p){skipped++;continue;}const extras=p.extras.filter(e=>i.extras.some(old=>old.id===e.id));items.push({...i,id:C.uid(),name:p.name,unitPrice:p.price,extras});}if(!items.length)return toast('Nenhum item deste pedido est\u00e1 dispon\u00edvel agora.');state.cart={storeId:o.storeId,items};save();location.hash='#/loja/'+o.storeId;render();toast('Sacola refeita com pre\u00e7os atuais. Confira itens e adicionais.'+(skipped?' '+skipped+' indispon\u00edvel(is) removido(s).':''));}
function editProduct(id){const p=id?state.products.find(p=>p.id===id):null;openModal(p?'Editar produto':'Novo produto',`<form id="product-form" data-id="${p?.id||''}"><label class="field"><span>Nome do produto</span><input name="name" maxlength="100" value="${esc(p?.name||'')}" required></label><div class="field-grid"><label class="field"><span>Categoria</span><input name="category" maxlength="50" value="${esc(p?.category||'Cl\u00e1ssicos')}" required></label><label class="field"><span>Pre\u00e7o (R$)</span><input name="price" inputmode="decimal" value="${p?(p.price/100).toFixed(2).replace('.',','):''}" placeholder="14,90" required></label></div><label class="field"><span>Descri\u00e7\u00e3o (opcional)</span><textarea name="description" maxlength="240">${esc(p?.description||'')}</textarea></label><label class="field"><span>Ilustra\u00e7\u00e3o de exemplo</span><select name="art">${[['pastel','Pastel'],['sweet','Doce'],['drink','Bebida'],['pizza','Pizza'],['acai','A\u00e7a\u00ed']].map(([v,l])=>`<option value="${v}" ${p?.art===v?'selected':''}>${l}</option>`).join('')}</select></label><div class="notice">As altera\u00e7\u00f5es n\u00e3o afetam pedidos anteriores. Confirme ingredientes e informa\u00e7\u00f5es antes de uso comercial.</div><button class="btn full spaced" type="submit">${ico('check')} Salvar no teste</button></form>`);}
function parseText(){rawText=$('#raw-text')?.value||rawText;if(!rawText.trim())return toast('Cole o texto do card\u00e1pio primeiro.');if(rawText.length>200000)return toast('Texto muito grande. Limite: 200 mil caracteres.');if(draft.length&&!confirm('Substituir o rascunho atual? O card\u00e1pio publicado n\u00e3o ser\u00e1 alterado.'))return;const result=C.parseMenu(rawText);draft=result.items;draftWarnings=result.warnings;if(draft.length>250){draft=draft.slice(0,250);draftWarnings.push('Limite de 250 produtos por lote. Confira os itens restantes no texto.');}render();if(!draft.length)toast(result.warnings[0]);else{toast(draft.length+' produtos no rascunho. Confira antes de publicar.');setTimeout(()=>$('#draft-list')?.scrollIntoView({behavior:'smooth',block:'start'}),60);}}
async function checkPdfServer(){if(location.protocol==='file:'){pdfReady=false;}else{try{const r=await fetch('/api/health',{signal:AbortSignal.timeout(2500)});const d=await r.json();pdfReady=!!d.pdf;}catch{pdfReady=false;}}const input=$('#pdf-file');if(input)input.disabled=!pdfReady||importBusy;const el=$('#pdf-status');if(el)el.textContent=pdfReady?'Leitura de PDF conectada ao servidor local.':'Para ler PDF, execute o projeto completo. Neste HTML, cole o texto ou use o exemplo.';}
async function importPdf(file){if(!file)return;const importStoreId=state.adminStore;if(!/\.pdf$/i.test(file.name))return toast('Escolha um arquivo PDF.');if(file.size>10*1024*1024)return toast('O limite por arquivo \u00e9 de 10 MB.');if(!pdfReady){toast('Leitura de PDF precisa do servidor inclu\u00eddo no projeto. Use o texto colado para testar aqui.');return;}if(draft.length&&!confirm('Substituir o rascunho atual por este PDF?'))return;importBusy=true;$('#pdf-status').textContent='Lendo o arquivo. Nada ser\u00e1 publicado automaticamente.';try{const data=await file.arrayBuffer();const resp=await fetch('/api/import-pdf',{method:'POST',headers:{'Content-Type':'application/pdf'},body:data,signal:AbortSignal.timeout(30000)});const result=await resp.json();if(state.adminStore!==importStoreId)throw new Error('A loja mudou durante a leitura. Importe novamente na loja correta.');if(!resp.ok)throw new Error(result.error||'N\u00e3o foi poss\u00edvel ler o PDF.');rawText=result.text;const parsed=C.parseMenu(rawText);draft=parsed.items.slice(0,250);draftWarnings=[...(result.warnings||[]),...parsed.warnings];if(parsed.items.length>250)draftWarnings.unshift('Somente os primeiros 250 produtos foram organizados. Confira o restante do PDF.');importSource=file.name+' \u00b7 '+result.pages+' p\u00e1gina(s).';if(!draft.length)toast('PDF lido, mas nenhum produto reconhecido. Confira o texto extra\u00eddo.');else toast(draft.length+' produtos organizados para revis\u00e3o.');}catch(e){toast(e.name==='TimeoutError'?'A leitura excedeu o tempo. Tente um arquivo menor.':e.message);}finally{importBusy=false;render();}}
function updateDraftProgress(){const n=draft.filter(C.validDraft).length;const count=$('#review-count');if(count)count.textContent=n+' de '+draft.length+' conferidos';const btn=$('#publish-button');if(btn)btn.disabled=!(draft.length&&draft.every(C.validDraft));}
function publishDraft(){if(!draft.length||!draft.every(C.validDraft))return toast('Confira todas as linhas e preencha valores v\u00e1lidos.');const shop=adminShop();let count=0,duplicates=0;for(const d of draft){if(state.products.some(p=>p.storeId===shop.id&&C.norm(p.name)===C.norm(d.name)&&C.norm(p.category)===C.norm(d.category))){duplicates++;continue;}state.products.push({id:C.uid(),storeId:shop.id,name:d.name.trim(),description:d.description.trim(),category:d.category.trim(),price:d.price,available:true,art:'pastel',extras:[]});count++;}save();draft=[];rawText='';draftWarnings=[];importSource='';location.hash='#/cardapio';toast(count+' produto(s) adicionado(s) ao teste.'+(duplicates?' '+duplicates+' duplicado(s) ignorado(s); os existentes n\u00e3o foram alterados.':''));}
function downloadJSON(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),notice:'DEMONSTRACAO: sem dados de producao',...state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='bocali-dados-de-teste.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
async function shareShop(id){const s=findShop(id);if(location.protocol==='file:'){openModal('Link direto da loja',`<p class="muted small">Este prot\u00f3tipo ainda n\u00e3o est\u00e1 publicado. Depois da hospedagem, o link abre diretamente a vitrine da loja.</p><label class="field spaced"><span>Rota preparada</span><input readonly value="#/loja/${esc(id)}"></label><div class="notice">N\u00e3o compartilhe o caminho local do arquivo como se fosse um site p\u00fablico.</div>`);return;}const url=location.href.split('#')[0]+'#/loja/'+id;try{await navigator.clipboard.writeText(url);toast('Link copiado. Ele s\u00f3 funciona onde este servidor estiver acess\u00edvel.');}catch{openModal('Link da loja',`<label class="field"><span>${esc(s.name)}</span><input readonly value="${esc(url)}"></label><p class="small muted">O servidor precisa estar acess\u00edvel para quem receber este link.</p>`);}}

let currentReceipt=null,soundEnabled=false,soundContext=null;

function myOrder(id){return state.orders.find(o=>o.id===id&&o.storeId===adminShop().id);}

 const o=myOrder(id);if(!o||o.status!=='new')return toast('Pedido j\u00e1 atualizado. Confira a fila.');
 const delivery=o.fulfillment==='delivery',presets=delivery?[[30,45],[45,60],[60,90],[90,120]]:[[10,15],[15,25],[25,35],[35,45]],prefs=printerPrefs();
 openModal('Aceitar '+esc(o.id),`<form id="accept-form" data-id="${esc(o.id)}"><span class="fulfillment-badge ${o.fulfillment}">${delivery?'ENTREGA':'RETIRADA / BALC\u00c3O'}</span><h3 class="accept-question">${delivery?'Em quanto tempo chega ao cliente?':'Em quanto tempo fica pronto para retirar?'}</h3><p class="small muted">${delivery?'Inclua preparo e deslocamento. O cliente ver\u00e1 o prazo total de entrega.':'Informe o tempo de preparo. N\u00e3o h\u00e1 deslocamento de entregador.'} O prazo come\u00e7a no momento do aceite.</p><div class="eta-presets">${presets.map(([min,max],i)=>`<button class="chip ${i===1?'active':''}" type="button" data-action="eta-preset" data-min="${min}" data-max="${max}">${min}\u2013${max} min</button>`).join('')}</div><div class="field-grid"><label class="field"><span>M\u00ednimo (minutos)</span><input id="eta-min" name="min" type="number" min="1" max="240" step="1" required value="${presets[1][0]}"></label><label class="field"><span>M\u00e1ximo (minutos)</span><input id="eta-max" name="max" type="number" min="1" max="240" step="1" required value="${presets[1][1]}"></label></div><div id="eta-preview" class="notice green"></div><label class="check-label spaced"><input id="accept-print" name="print" type="checkbox" ${prefs.autoPrint?'checked':''}>Abrir impress\u00e3o da cozinha ao aceitar</label><p class="small muted" style="margin:10px 0 18px">Papel configurado: ${prefs.paper} mm. Neste teste, voc\u00ea escolhe a impressora e confirma na janela do navegador.</p><button class="btn full" id="confirm-accept" type="submit">${ico('check')} Aceitar com este prazo</button><p class="cart-caption">Pedido e pagamento simulados. Nenhuma mensagem ser\u00e1 enviada.</p></form>`);updateEtaPreview();

function updateEtaPreview(){

 if(selection){const p=screenPoint(selection);layers.push(`<g transform="translate(${p[0]},${p[1]})"><circle r="17" fill="#173f361b"/><path d="M0 0C-4-7-13-16-13-24a13 13 0 0 1 26 0C13-16 4-7 0 0" fill="#173f36" stroke="white" stroke-width="2.5"/><circle cy="-24" r="4" fill="white"/></g>`);}
 return `<svg class="geo-svg map-focus" id="${id}-svg" data-geo-map="${id}" viewBox="0 0 800 520" role="img" aria-label="Mapa de \u00e1reas de entrega da loja. Use os exemplos abaixo para testar sem clicar no mapa." tabindex="0">${background}${layers.join('')}</svg>`;

 const s=adminShop();if(geo.owner!==s.id){geo.owner=s.id;geo.edit=null;geo.selected=null;geo.center={...s.deliveryConfig.reference};geo.zoom=13;}

 return `${adminHeading('\u00c1reas e taxas de entrega.','Cada loja desenha a cobertura. O endere\u00e7o determina a taxa.')}<div class="notice">Demonstra\u00e7\u00e3o: contornos e valores fict\u00edcios. N\u00e3o s\u00e3o os bairros oficiais nem as taxas do Cantinho. A refer\u00eancia no mapa n\u00e3o \u00e9 a localiza\u00e7\u00e3o da loja.</div><div class="delivery-grid"><section class="map-panel"><div class="map-panel-head"><div><h2>${esc(cfg.city)} \u00b7 ${esc(cfg.state)}</h2><p class="map-caption">${active.length} \u00e1reas ativas \u00b7 configura\u00e7\u00e3o exclusiva de ${esc(s.name)}</p></div><span class="map-mode">${geo.tiles?'RUAS ONLINE':'MODO ESQUEM\u00c1TICO'}</span></div>${mapBox('admin-map')}<div class="map-footer">${geo.edit?'Clique no mapa para acrescentar pontos ao contorno. Use Salvar quando terminar.':'Clique em um ponto para simular a taxa. Para criar um contorno, toque em Nova \u00e1rea.'}<p class="zone-help-line">Ruas online s\u00e3o opcionais, exigem internet e o servidor local. O provedor recebe IP e regi\u00e3o visualizada. Nenhum GPS \u00e9 solicitado.</p></div></section><aside class="zones-side">${geo.edit?zoneEditorHTML():zoneListHTML(s)}<section class="panel"><div class="eyebrow muted">SIMULADOR DE COBERTURA</div><h2 style="margin-top:7px">Quanto custa entregar?</h2><p class="small muted" style="margin-top:9px">Experimente pontos fict\u00edcios dentro e fora das \u00e1reas.</p><div class="sample-buttons">${[0,1,2,3].map(i=>`<button class="btn secondary" data-geo="sample" data-index="${i}">${i===3?'Fora da \u00e1rea':'Ponto '+String.fromCharCode(65+i)}</button>`).join('')}</div><div id="admin-quote">${geo.selected?feeResult(D.quote(s,geo.selected)):'<div class="geo-status muted">Selecione um ponto de teste para ver a taxa.</div>'}</div><a class="btn full spaced" href="#/loja/${esc(s.id)}">Testar no pedido ${ico('arrow')}</a></section><div class="zone-note"><strong>Regra de encontro das \u00e1reas</strong><br>Vale a maior prioridade, sem somar taxas. Empate bloqueia o pedido at\u00e9 corre\u00e7\u00e3o. Uma \u00e1rea sem entrega sempre bloqueia. Retirada no balc\u00e3o tem taxa zero.</div></aside></div>`;
}
function zoneListHTML(s){return `<section class="panel"><div class="row" style="justify-content:space-between"><h2>Suas \u00e1reas</h2><button class="btn secondary" data-geo="new">+ Nova \u00e1rea</button></div><div class="zone-list">${s.deliveryConfig.zones.map((z,i)=>`<div class="zone-row ${z.active?'':'disabled'}"><span class="zone-dot" style="background:${z.kind==='blocked'?'#cb5752':zoneColors[i%3]}"></span><div><strong>${esc(z.name)}</strong><small>${z.kind==='blocked'?'Sem entrega':'Prioridade '+z.priority} \u00b7 ${z.active?'ativa':'pausada'}</small></div><div style="text-align:right"><strong class="zone-price">${z.kind==='blocked'?'\u2014':brl(z.fee)}</strong><button class="text-link" data-geo="edit" data-id="${esc(z.id)}">Editar</button></div></div>`).join('')}</div><p class="zone-rules">Os pre\u00e7os s\u00e3o apenas exemplos.<br><strong>A regra \u00e9 por \u00e1rea, n\u00e3o por quil\u00f4metro.</strong></p></section>`;}
function zoneEditorHTML(){const z=geo.edit;return `<section class="panel"><div class="zone-edit-title"><h2>Editar contorno</h2><button class="text-link" data-geo="cancel-edit">Cancelar</button></div><form id="zone-form"><label class="field"><span>Nome da \u00e1rea</span><input id="zone-name" maxlength="60" required value="${esc(z.name)}"></label><div class="field-grid"><label class="field"><span>Taxa (R$)</span><input id="zone-fee" inputmode="decimal" value="${(z.fee/100).toFixed(2).replace('.',',')}" required></label><label class="field"><span>Prioridade</span><input id="zone-priority" type="number" min="0" max="999" step="1" value="${z.priority}" required></label></div><label class="field"><span>Tipo</span><select id="zone-kind"><option value="delivery" ${z.kind==='delivery'?'selected':''}>Entrega dispon\u00edvel</option><option value="blocked" ${z.kind==='blocked'?'selected':''}>Sem entrega / exclus\u00e3o</option></select></label><label class="check-label"><input id="zone-active" type="checkbox" ${z.active?'checked':''}>\u00c1rea ativa</label><div class="zone-point-count" id="zone-point-count">${z.ring.length} pontos no contorno</div><div class="sample-buttons"><button type="button" class="btn secondary" data-geo="undo-point">Desfazer ponto</button><button type="button" class="btn secondary" data-geo="redraw">Redesenhar</button></div><details class="spaced"><summary class="small">Adicionar ponto pelas coordenadas</summary><div class="field-grid spaced"><label class="field"><span>Latitude</span><input id="vertex-lat" type="number" step="any" placeholder="-22.925"></label><label class="field"><span>Longitude</span><input id="vertex-lng" type="number" step="any" placeholder="-45.461"></label></div><button type="button" class="btn secondary" data-geo="add-vertex">Adicionar ponto</button></details><button type="submit" class="btn full spaced">Salvar \u00e1rea no teste</button><p class="zone-help-line">A mudan\u00e7a vale para novos c\u00e1lculos. Pedidos j\u00e1 criados mant\u00eam o valor original.</p></form></section>`;}
function mountDeliveryMap(){refreshMap();}
function keepEditFields(){if(!geo.edit||!$('#zone-form'))return;geo.edit.name=$('#zone-name').value;const s=$('#zone-fee').value.trim();geo.edit.fee=/^0([,.]0{1,2})?$/.test(s)?0:C.moneyToCents(s);geo.edit.priority=Number($('#zone-priority').value);geo.edit.kind=$('#zone-kind').value;geo.edit.active=$('#zone-active').checked;}
function updatePointCount(){if($('#zone-point-count'))$('#zone-point-count').textContent=geo.edit.ring.length+' pontos no contorno';refreshMap();}
function addressFormHTML(){return `<div class="delivery-fields spaced"><label class="field"><span>Rua / avenida</span><input id="addr-street" maxlength="120" placeholder="Use um exemplo abaixo" autocomplete="off"></label><label class="field"><span>N\u00famero</span><input id="addr-number" maxlength="20" placeholder="100" autocomplete="off"></label><label class="field"><span>Bairro</span><input id="addr-neighborhood" maxlength="120" autocomplete="off"></label><label class="field"><span>CEP (opcional)</span><input id="addr-postcode" maxlength="9" inputmode="numeric" autocomplete="off"></label><label class="field"><span>Cidade</span><input id="addr-city" value="Pindamonhangaba" maxlength="120" autocomplete="off"></label><label class="field"><span>UF</span><input id="addr-state" value="SP" maxlength="2" autocomplete="off"></label><label class="field wide"><span>Complemento (opcional)</span><input id="addr-complement" maxlength="120" autocomplete="off"></label></div><div class="sample-buttons"><button type="button" class="btn" data-geo="lookup">Localizar endere\u00e7o</button>${[0,1,2,3].map(i=>`<button type="button" class="btn secondary" data-geo="checkout-sample" data-index="${i}">${i===3?'Fora da \u00e1rea':'Exemplo '+String.fromCharCode(65+i)}</button>`).join('')}</div><div id="geo-status" class="geo-status" role="status">Use os exemplos fict\u00edcios. A busca real s\u00f3 funciona com o servidor e o provedor configurados.</div><div id="address-results"></div><div class="checkout-map">${mapBox('checkout-map')}</div><div id="delivery-quote"></div><button type="button" class="btn soft full spaced" data-geo="confirm-address" id="confirm-address" disabled>Confirmar este endere\u00e7o e esta taxa</button>`;}
function readAddress(){const a={};['street','number','neighborhood','city','state','postcode','complement'].forEach(k=>a[k]=$('#addr-'+k)?.value.trim()||'');a.state=a.state.toUpperCase();return a;}
function fillAddress(a){Object.entries(a).forEach(([k,v])=>{const e=$('#addr-'+k);if(e)e.value=v;});}
function checkout(){try{C.validateCart(state);}catch(e){return toast(e.message);}checkoutMode='delivery';checkoutPayment='cash';geo.selection=null;geo.confirmed=null;geo.results=[];geo.sequence++;geo.center={...findShop(state.cart.storeId).deliveryConfig.reference};geo.zoom=13;openModal('Endere\u00e7o e taxa de entrega',`<div class="notice">Pedido de teste. N\u00e3o informe dados reais. Valores e cobertura s\u00e3o fict\u00edcios.</div><h3 class="small spaced" style="margin-bottom:12px">Como voc\u00ea receberia?</h3><label class="checkout-option"><input type="radio" name="fulfillment" value="delivery" checked>Entrega<span class="option-detail">Por endere\u00e7o</span></label><label class="checkout-option"><input type="radio" name="fulfillment" value="pickup">Retirada no balc\u00e3o<span class="option-detail">Sem taxa</span></label><div id="delivery-example">${addressFormHTML()}</div><h3 class="small spaced" style="margin-bottom:12px">Pagamento simulado</h3><label class="checkout-option"><input type="radio" name="payment" value="cash" checked>Dinheiro</label><label class="checkout-option"><input type="radio" name="payment" value="card">Cart\u00e3o na entrega / retirada</label><label class="checkout-option"><input type="radio" name="payment" value="pix">Pix (n\u00e3o integrado)</label><label class="field spaced"><span>Observa\u00e7\u00e3o do teste (opcional)</span><textarea id="checkout-note" maxlength="200" placeholder="N\u00e3o inclua dados pessoais."></textarea></label><div id="checkout-totals"></div><button class="btn full spaced" id="place-order" data-action="place-order" disabled>Simular pedido</button><p class="cart-caption">Sem cobran\u00e7a. Dados apenas neste navegador.</p>`);$('#modal').classList.add('delivery-modal');updateDeliveryCheckout();checkGeoServer();}
function checkoutTotals(){const t=C.totals(state.cart,checkoutMode==='pickup'?0:geo.confirmed?.quote?.fee||0);const known=checkoutMode==='pickup'||!!geo.confirmed;return `<div class="amount-row"><span>Produtos</span><span>${brl(t.subtotal)}</span></div><div class="amount-row"><span>Taxa de entrega</span><span>${known?brl(t.fee):'A calcular'}</span></div><div class="amount-row total"><span>Total simulado</span><span>${known?brl(t.total):'A confirmar'}</span></div>`;}
function updateDeliveryCheckout(){if(!$('#checkout-totals'))return;const shop=findShop(state.cart.storeId);let q=geo.selection?D.quote(shop,geo.selection.point):null;if(geo.confirmed){try{D.validateDelivery(shop,geo.confirmed);}catch{geo.confirmed=null;}}
 $('#checkout-totals').innerHTML=checkoutTotals();$('#place-order').disabled=checkoutMode==='delivery'&&!geo.confirmed;
 const confirm=$('#confirm-address');if(confirm){confirm.disabled=!q?.ok||!geo.selection?.precise||!D.validAddress(readAddress());confirm.textContent=geo.confirmed?'Endere\u00e7o e taxa confirmados':'Confirmar este endere\u00e7o e esta taxa';}
 if($('#delivery-quote'))$('#delivery-quote').innerHTML=q?feeResult(q):'';refreshMap();}
function selectAddress(selection){geo.selection=D.clone(selection);geo.confirmed=null;geo.sequence++;fillAddress(selection.address);$('#address-results').innerHTML='';$('#geo-status').textContent=selection.source==='demo'?'Ponto fict\u00edcio localizado no teste. Confira o mapa e confirme a taxa.':selection.precise?'Resultado localizado. Confira o endere\u00e7o retornado e confirme o ponto.':'Resultado impreciso: rua, bairro ou cidade n\u00e3o bastam. Corrija o n\u00famero/endereco e consulte novamente.';updateDeliveryCheckout();}
async function checkGeoServer(){geo.ready=false;if(location.protocol==='file:')return;try{const r=await fetch('/api/health',{signal:AbortSignal.timeout(2500)});const d=await r.json();geo.ready=!!d.geocoding;}catch{} }
async function lookupAddress(){const address=readAddress();geo.sequence++;const seq=geo.sequence;geo.confirmed=null;geo.selection=null;geo.results=[];$('#address-results').innerHTML='';updateDeliveryCheckout();if(!D.validAddress(address)){return $('#geo-status').textContent='Preencha rua, n\u00famero, bairro, cidade e UF. Confira o CEP, se informado.';}
 for(let i=0;i<4;i++){const s=D.sample(i);if(D.addressKey({...address,complement:''})===D.addressKey(s.address)){s.address=address;selectAddress(s);return;}}
 if(!geo.ready){$('#geo-status').textContent='Busca real n\u00e3o conectada. Execute o servidor e configure GEOAPIFY_API_KEY. Nenhum ponto nem taxa foi inventado.';return;}
 if(!confirm('Consultar este endere\u00e7o no provedor Geoapify? Rua, n\u00famero, bairro, cidade, UF e CEP ser\u00e3o enviados. O complemento n\u00e3o ser\u00e1 enviado. Use somente dados fict\u00edcios neste prot\u00f3tipo.'))return;
 $('#geo-status').textContent='Consultando o endere\u00e7o...';try{const safe={...address};delete safe.complement;const r=await fetch('/api/geocode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:safe}),signal:AbortSignal.timeout(14000)});const data=await r.json();if(seq!==geo.sequence||!$('#addr-street')||D.addressKey(readAddress())!==D.addressKey(address))return;if(!r.ok)throw new Error(data.error||'Falha ao consultar o endere\u00e7o.');geo.results=(data.results||[]).map(x=>({...x,address:{...x.address,complement:address.complement}}));$('#geo-status').textContent=geo.results.length?'Selecione o resultado correto. O valor s\u00f3 ser\u00e1 liberado ap\u00f3s conferir o ponto.':'Endere\u00e7o n\u00e3o localizado. Corrija e tente novamente.';$('#address-results').innerHTML=geo.results.length?`<div class="address-result"><strong>Resultados encontrados</strong>${geo.results.map((x,i)=>`<button type="button" class="btn secondary" data-geo="choose-result" data-index="${i}">${esc(x.formatted||D.formatAddress(x.address))}${x.precise?'':' \u2014 impreciso'}</button>`).join('')}<p class="zone-help-line">Geocodifica\u00e7\u00e3o: Geoapify \u00b7 dados OpenStreetMap</p></div>`:'';}catch(e){if(seq===geo.sequence&&$('#geo-status'))$('#geo-status').textContent='N\u00e3o foi poss\u00edvel localizar. Nenhuma taxa foi aplicada. '+(e.name==='TimeoutError'?'Tempo de consulta excedido.':e.message);}}
function placeOrder(){const b=$('#place-order');if(b)b.disabled=true;try{if(checkoutMode==='delivery'&&(!geo.confirmed||D.addressKey(readAddress())!==geo.confirmed.addressKey))throw new Error('O endere\u00e7o mudou. Localize e confirme novamente.');const o=C.createOrder(state,{fulfillment:checkoutMode,payment:checkoutPayment,note:$('#checkout-note').value,delivery:checkoutMode==='delivery'?geo.confirmed:null});save();render();openModal('Pedido simulado criado',`<div class="success"><div class="success-mark">${ico('check')}</div><h2>${esc(o.id)}</h2><p>${esc(o.storeName)}<br>Entrega: <strong>${brl(o.fee)}</strong><br>Total: <strong>${brl(o.total)}</strong><br>Nenhum pagamento foi cobrado.</p>${o.delivery?`<div class="delivery-order"><strong>${esc(o.delivery.quote.zoneName)}</strong>${esc(D.formatAddress(o.delivery.address))}</div>`:'<p>Retirada no balc\u00e3o, sem taxa de entrega.</p>'}<button class="btn full" data-action="goto-orders">Acompanhar pedido</button><button class="btn secondary full" data-action="goto-admin" data-store="${esc(o.storeId)}">Ver no aceitador da loja</button></div>`);}catch(e){toast(e.message);geo.confirmed=null;updateDeliveryCheckout();}}
function deliveryOrderHTML(o){return o.delivery?`<div class="delivery-order"><strong>${esc(D.formatAddress(o.delivery.address))}</strong>${esc(o.delivery.quote.zoneName)} \u00b7 Taxa registrada: ${brl(o.fee)}<br><small>Endere\u00e7o de teste. N\u00e3o despachar.</small></div>`:'';}
function deliveryReceiptHTML(o){return o.delivery?`<p><b>Endere\u00e7o de teste:</b><br>${esc(D.formatAddress(o.delivery.address))}<br>${esc(o.delivery.quote.zoneName)} \u00b7 Taxa: ${brl(o.fee)}<br>N\u00e3o despachar.</p>`:'<p>Endere\u00e7o de teste n\u00e3o registrado. N\u00e3o despachar.</p>';}
function deliverySummaryHTML(s){const rates=s.deliveryConfig.zones.filter(z=>z.active&&z.kind==='delivery').map(z=>z.fee);return `<div class="delivery-strip"><div><strong>Entrega por \u00e1rea</strong><p>${rates.length?'Taxas de exemplo a partir de '+brl(Math.min(...rates))+'.':'Nenhuma \u00e1rea de entrega ativa.'} Cada endere\u00e7o precisa estar na cobertura.</p></div><a class="btn secondary" href="#/areas">Configurar mapa e taxas</a></div>`;}
document.addEventListener('click',e=>{
 const target=e.target.closest('[data-geo]');if(target){const action=target.dataset.geo,index=Number(target.dataset.index);e.preventDefault();
 if(action==='zoom-in'||action==='zoom-out'){geo.zoom=Math.max(10,Math.min(18,geo.zoom+(action==='zoom-in'?1:-1)));refreshMap();}
 else if(action==='center'){geo.center={...(state.cart.storeId&&$('#checkout-map')?findShop(state.cart.storeId):adminShop()).deliveryConfig.reference};geo.zoom=13;refreshMap();}
 else if(action==='tiles'){if(location.protocol==='file:')return toast('Para carregar ruas online, abra o projeto pelo servidor local. O HTML avulso mant\u00e9m o mapa esquem\u00e1tico.');if(!geo.tiles&&!confirm('Carregar mapas OpenStreetMap pela internet? O provedor recebe IP e regi\u00e3o visualizada. Use apenas teste moderado; n\u00e3o h\u00e1 garantia de disponibilidade.'))return;geo.tiles=!geo.tiles;target.textContent=geo.tiles?'Desligar ruas online':'Carregar ruas online';refreshMap();}
 else if(action==='sample'){geo.selected=D.sample(index).point;$('#admin-quote').innerHTML=feeResult(D.quote(adminShop(),geo.selected));refreshMap();}
 else if(action==='new'){geo.edit={id:C.uid(),storeId:adminShop().id,name:'Nova \u00e1rea',fee:500,priority:40,kind:'delivery',active:true,ring:[]};render();}
 else if(action==='edit'){geo.edit=D.clone(adminShop().deliveryConfig.zones.find(z=>z.id===target.dataset.id));render();}
 else if(action==='cancel-edit'){geo.edit=null;render();}
 else if(action==='undo-point'){keepEditFields();geo.edit.ring.pop();updatePointCount();}
 else if(action==='redraw'){keepEditFields();geo.edit.ring=[];updatePointCount();}
 else if(action==='add-vertex'){const lat=$('#vertex-lat').value,lng=$('#vertex-lng').value;const p={lat:Number(lat),lng:Number(lng)};if(!lat||!lng||!D.validPoint(p))return toast('Informe latitude e longitude v\u00e1lidas.');keepEditFields();geo.edit.ring.push([p.lng,p.lat]);updatePointCount();}
 else if(action==='checkout-sample'){selectAddress(D.sample(index));}
 else if(action==='lookup')lookupAddress();
 else if(action==='choose-result'){const s=geo.results[index];if(s)selectAddress(s);}
 else if(action==='confirm-address'){try{geo.selection.address=readAddress();geo.confirmed=D.confirmSelection(findShop(state.cart.storeId),geo.selection);$('#geo-status').textContent='Endere\u00e7o e taxa confirmados. Confira o total antes de simular o pedido.';updateDeliveryCheckout();}catch(err){toast(err.message);}}
 return;}
 const map=e.target.closest('[data-geo-map]');if(!map)return;const xy=new DOMPoint(e.clientX,e.clientY).matrixTransform(map.getScreenCTM().inverse()),c=mercator(geo.center,geo.zoom),p=unmercator(c.x+xy.x-400,c.y+xy.y-260,geo.zoom);
 if(map.dataset.geoMap==='admin-map'){if(geo.edit){keepEditFields();if(geo.edit.ring.length>=100)return toast('Limite de 100 pontos por \u00e1rea.');geo.edit.ring.push([p.lng,p.lat]);updatePointCount();}else{geo.selected=p;$('#admin-quote').innerHTML=feeResult(D.quote(adminShop(),p));refreshMap();}}
 else toast('O ponto do cliente vem do endere\u00e7o localizado. Corrija o endere\u00e7o ou use outro exemplo; n\u00e3o escolha uma taxa clicando no mapa.');
});
document.addEventListener('input',e=>{if(!e.target.id.startsWith('addr-'))return;geo.confirmed=null;geo.selection=null;geo.sequence++;geo.results=[];if($('#address-results'))$('#address-results').innerHTML='';if($('#geo-status'))$('#geo-status').textContent='Endere\u00e7o alterado. Localize e confirme novamente.';updateDeliveryCheckout();});
document.addEventListener('change',e=>{if(e.target.name==='fulfillment')updateDeliveryCheckout();});
document.addEventListener('submit',e=>{if(e.target.id!=='zone-form')return;e.preventDefault();try{keepEditFields();D.saveZone(adminShop(),geo.edit);save();geo.edit=null;render();toast('\u00c1rea salva. Novos pedidos usar\u00e3o a nova configura\u00e7\u00e3o.');}catch(err){toast(err.message);}});
window.addEventListener('storage',e=>{if(e.key===KEY&&$('#checkout-totals')){D.migrate(state);geo.confirmed=null;updateDeliveryCheckout();if($('#geo-status'))$('#geo-status').textContent='Os dados mudaram em outra aba. Confira o endere\u00e7o e a taxa novamente.';}});
$('#modal').addEventListener('close',()=>{geo.sequence++;$('#modal').classList.remove('delivery-modal');});
if(!location.hash)location.hash='#/minhas-lojas';else render();save();

</script>
</body></html>
